name: devops-jenkins

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: devops-jenkins:latest
    container_name: devops-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - devops-jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE:-~}/.kube:/host-kube:ro
    logging: *default-logging
    networks:
      - devops-jenkins-net

volumes:
  devops-jenkins-data:
    name: devops-jenkins-data

networks:
  devops-jenkins-net:
    name: devops-jenkins-net
    driver: bridge
